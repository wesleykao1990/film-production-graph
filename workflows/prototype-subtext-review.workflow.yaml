api_version: film.workflow/v2
name: prototype-subtext-review
version: 1.0.0
inputs:
  scene_contract_version_id: string
  screenplay_scene_version_id: string
outputs:
  approved_patch_version_id: string
steps:
  - id: subtext-pass
    type: agent_run
    skill: subtext-pass
    max_attempts: 1
    budget:
      max_cost_usd: 0.0
  - id: scope-preservation
    type: validator
    validator: prototype-scope-preservation-v1
    needs: [subtext-pass]
  - id: approval
    type: human_approval
    needs: [scope-preservation]
    human_policy:
      role: owner_or_reviewer
  - id: emit
    type: emit_artifact
    needs: [approval]
    output_map:
      approved_patch_version_id: $steps.subtext-pass.output_version_id
