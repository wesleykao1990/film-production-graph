[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "film-production-graph-dev"
version = "0.0.0"
description = "M01 artifact, lineage, impact, and rights development workspace"
requires-python = ">=3.11"
dependencies = [
  "film-graph-agent-runtime==0.1.0",
  "film-graph-api==0.1.0",
  "film-graph-application==0.1.0",
  "film-graph-contracts==0.1.0",
  "film-graph-domain==0.1.0",
  "film-graph-media==0.1.0",
  "film-graph-model-routing==0.1.0",
  "film-graph-provider-contracts==0.1.0",
  "film-graph-skill-loader==0.1.0",
  "film-graph-persistence==0.1.0",
  "psycopg[binary]>=3.2,<4",
  "jsonschema>=4.23,<5",
  "pydantic-ai-slim>=1,<2",
  "PyYAML>=6,<7",
  "referencing>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.14,<2",
  "pytest>=8,<10",
  "ruff>=0.12,<1",
  "types-PyYAML>=6,<7",
  "uvicorn>=0.30,<1",
]

[tool.setuptools]
py-modules = []

[tool.uv.workspace]
members = [
  "apps/api",
  "packages/domain",
  "packages/contracts",
  "packages/application",
  "packages/model-routing",
  "packages/provider-contracts",
  "packages/media",
  "packages/agent-runtime",
  "packages/persistence",
  "packages/skill-loader",
]

[tool.uv.sources]
film-graph-agent-runtime = { workspace = true }
film-graph-api = { workspace = true }
film-graph-application = { workspace = true }
film-graph-contracts = { workspace = true }
film-graph-domain = { workspace = true }
film-graph-media = { workspace = true }
film-graph-model-routing = { workspace = true }
film-graph-provider-contracts = { workspace = true }
film-graph-skill-loader = { workspace = true }
film-graph-persistence = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests", "prototype/tests"]
addopts = "-q"
pythonpath = ["prototype"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["prototype", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
namespace_packages = true
explicit_package_bases = true
exclude = ["prototype/"]
