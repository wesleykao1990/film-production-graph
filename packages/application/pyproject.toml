[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "film-graph-application"
version = "0.1.0"
description = "Framework-independent application services for Film Production Graph"
requires-python = ">=3.11"
dependencies = [
  "film-graph-domain==0.1.0",
  "film-graph-contracts==0.1.0",
  "film-graph-model-routing==0.1.0",
  "PyYAML>=6,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"film_graph.application" = ["py.typed"]
