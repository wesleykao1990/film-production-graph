[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "film-graph-contracts"
version = "0.1.0"
description = "Pure wire and provider-neutral contracts for Film Production Graph"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"film_graph.contracts" = ["py.typed"]
