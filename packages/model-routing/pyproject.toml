[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "film-graph-model-routing"
version = "0.1.0"
description = "Application-owned model aliases for Film Production Graph"
requires-python = ">=3.11"
dependencies = ["film-graph-contracts==0.1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"film_graph.model_routing" = ["py.typed"]
