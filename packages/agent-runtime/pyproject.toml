[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "film-graph-agent-runtime"
version = "0.1.0"
description = "Deterministic offline agent fakes and ports for Film Production Graph"
requires-python = ">=3.11"
dependencies = [
  "film-graph-contracts==0.1.0",
  "film-graph-provider-contracts==0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"film_graph.agent_runtime" = ["py.typed"]
