[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "film-graph-agent-runtime"
version = "0.1.0"
description = "Typed least-privilege offline agent runtime for Film Production Graph"
requires-python = ">=3.11"
dependencies = [
  "film-graph-contracts==0.1.0",
  "film-graph-model-routing==0.1.0",
  "film-graph-provider-contracts==0.1.0",
  "pydantic>=2,<3",
  "pydantic-ai-slim>=1,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"film_graph.agent_runtime" = ["py.typed"]
