[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "film-graph-api"
version = "0.1.0"
description = "FastAPI M01 core API for Film Production Graph"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "pydantic>=2,<3",
  "film-graph-application==0.1.0",
  "film-graph-domain==0.1.0",
  "film-graph-persistence==0.1.0",
  "film-graph-skill-loader==0.1.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "uvicorn>=0.30"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"film_graph.api" = ["py.typed"]
