audio_bible_id: AUDIO_BLUE_PEN_V2
voice_profiles:
  - voice_profile_id: VOICE_MARA_V1
    character_id: MARA
    provider_strategy:
      preferred_provider_alias: fake-tts
    reference_asset_version_ids: []
    identity:
      vocal_register: alto
      texture: restrained
      baseline_pace: 0.92
    speech_fingerprint:
      cadence: short_then_qualifier
      hesitation: breath_before_denial
    pronunciation_dictionary_ref: null
    rights_record_ref: RIGHTS_FIXTURE_VOICES
  - voice_profile_id: VOICE_IVO_V1
    character_id: IVO
    provider_strategy:
      preferred_provider_alias: fake-tts
    reference_asset_version_ids: []
    identity:
      vocal_register: baritone
      texture: dry
      baseline_pace: 0.80
    speech_fingerprint:
      cadence: delayed_question
      hesitation: holds_silence
    pronunciation_dictionary_ref: null
