purpose: Explore whether protection becomes a form of coercion when it removes another person's right to choose.
audience: Adult short-film audience comfortable with ambiguity.
emotional_promise: A restrained procedural encounter becomes a personal betrayal without explanatory monologues.
thematic_argument:
  claim_a: Protecting someone can justify withholding the truth.
  claim_b: Withholding the truth removes their right to choose.
  dramatic_test: Both positions must produce a real benefit and a real cost.
genre_promises:
  - contained institutional drama
  - relationship thriller
style_laws:
  - tension emerges through procedure, objects, withheld information, and reaction
  - no generic villain speech
  - silence has a specific tactical function
forbidden_cliches:
  - sudden sentimental reconciliation
  - anonymous threatening message
  - explanatory flashback
forbidden_visual_defaults:
  - empty neon corridor solely for atmosphere
  - random slow motion
  - generic rain on glass without story function
desired_ambiguity: The audience should remain unsure whether Ivo signed to help Mara or to trap her.
production_constraints:
  - two principal characters
  - one archive room
  - one recurring prop
  - 60 to 90 seconds
