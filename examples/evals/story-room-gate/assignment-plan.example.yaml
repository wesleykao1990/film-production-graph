freeze_requirements:
- Replace R1..R7 with opaque rater IDs.
- Freeze the selected primary and repeat assignments before primary ratings begin.
- Every completed primary rater must rate both positive-control anchors.
- If the timing pilot fails, recruit a seventh rater or shorten the rated scene within
  the frozen page range; do not reduce ratings per triplet.
- Do not reassign completed triplets after looking at ratings.
- Record withdrawals and missing assignments; do not silently impute ratings.
